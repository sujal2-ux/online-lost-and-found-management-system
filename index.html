<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Lost & Found Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Online Lost & Found</h1>
        <p>Management System</p>
    </header>

    <section class="hero">
        <h2>Find What You've Lost</h2>
        <p>Report lost items and help others find their belongings.</p>

        <button>Report Lost Item</button>
        <button>Report Found Item</button>
    </section>

    <section class="items">
        <h2>Recent Items</h2>

        <div class="item">
            <h3>Black Wallet</h3>
            <p>Location: College Campus</p>
            <p>Status: Lost</p>
        </div>

        <div class="item">
            <h3>Blue Water Bottle</h3>
            <p>Location: Library</p>
            <p>Status: Found</p>
        </div>
    </section>

    <footer>
        <p>© 2026 Online Lost & Found Management System</p>
    </footer>

</body>
</html>
